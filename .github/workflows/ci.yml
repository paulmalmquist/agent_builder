name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent_builder
          POSTGRES_PASSWORD: agent_builder
          POSTGRES_DB: agent_builder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_builder -d agent_builder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://agent_builder:agent_builder@localhost:5432/agent_builder_test?schema=public
      BIGQUERY_ENABLED: 'false'
      GENERATOR_CONCURRENCY: '2'
      RUN_DATABASE_INTEGRATION: 'true'
      EXECUTION_DISPATCH_MODE: external
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.28.0
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run check:sanitized
      - run: npm run check:console-copy
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Install Chromium for smoke tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: docker compose config

  containers:
    runs-on: ubuntu-latest
    needs: validate
    env:
      SEED_ON_BOOT: 'true'
      REPOSITORY_SOURCE_COMMIT: ${{ github.sha }}
      ALLOW_UNVERIFIED_REPOSITORY_IMPORTS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker compose up -d --build
      - name: Verify proxied health and OpenAPI
        run: |
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/health
          curl --fail http://localhost:8080/openapi.json
      - name: Verify governed lifecycle through external worker
        run: npm run smoke:compose
      - name: Verify idempotent restart
        run: |
          docker compose down
          docker compose up -d
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/health
      - name: Assert idempotent seed counts
        run: |
          docker compose exec -T postgres psql -U agent_builder -d agent_builder -tAc "SELECT count(*) FROM \"AgentFamily\" WHERE \"slug\" = 'supplier-delay-alert';" | grep -qx 1
          docker compose exec -T postgres psql -U agent_builder -d agent_builder -tAc "SELECT count(*) FROM \"Agent\" WHERE \"slug\" = 'supplier-delay-alert-v1';" | grep -qx 1
          docker compose exec -T postgres psql -U agent_builder -d agent_builder -tAc "SELECT count(*) FROM \"AgentFamily\" WHERE \"slug\" = 'inventory-risk-analyst';" | grep -qx 1
          docker compose exec -T postgres psql -U agent_builder -d agent_builder -tAc "SELECT count(*) FROM \"Agent\" WHERE \"slug\" = 'inventory-risk-analyst-v1';" | grep -qx 1
          docker compose exec -T postgres psql -U agent_builder -d agent_builder -tAc "SELECT count(*) FROM \"KnowledgeSource\" WHERE \"id\" = 'bq-operations-builds';" | grep -qx 1
      - if: always()
        run: docker compose down -v

  workstation-broker:
    name: Workstation broker proposal
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: apps/workstation-broker/**/packages.lock.json
      - run: npm ci
      - run: npm run build -w @agent-builder/contracts
      - name: Regenerate pinned control-plane client
        shell: pwsh
        run: apps/workstation-broker/scripts/generate-client.ps1 -SkipContractBuild
      - name: Assert OpenAPI client generation is reproducible
        shell: pwsh
        run: git diff --exit-code -- apps/workstation-broker/openapi apps/workstation-broker/src/PaulOs.ControlPlane.Client/Generated
      - name: Restore locked broker dependencies
        shell: pwsh
        run: >-
          dotnet restore apps/workstation-broker/PaulOs.WorkstationBroker.slnx
          --locked-mode --configfile apps/workstation-broker/NuGet.Config
      - name: Build broker with warnings as errors
        run: dotnet build apps/workstation-broker/PaulOs.WorkstationBroker.slnx -c Release --no-restore
      - name: Run workstation protocol tests
        run: >-
          dotnet test apps/workstation-broker/tests/PaulOs.WorkstationBroker.Tests/PaulOs.WorkstationBroker.Tests.csproj
          -c Release --no-build --no-restore --collect:"XPlat Code Coverage"
      - name: Build unsigned local proposal MSI
        shell: pwsh
        run: apps/workstation-broker/scripts/build-proposal-msi.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: workstation-broker-unsigned-proposal-msi
          path: apps/workstation-broker/installer/bin/x64/Release/PaulOs.WorkstationBroker.msi
          if-no-files-found: error
