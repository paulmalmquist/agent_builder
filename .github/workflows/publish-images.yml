name: Publish container images

on:
  workflow_run:
    workflows: [Console Copy Certification]
    types: [completed]

permissions: {}

concurrency:
  group: publish-container-images-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            dockerfile: apps/backend/Dockerfile
          - service: frontend
            dockerfile: apps/frontend/Dockerfile
          - service: worker
            dockerfile: apps/worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Download semantic certification evidence
        uses: actions/download-artifact@v4
        with:
          name: console-copy-certification
          path: certification-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify certification belongs to this source revision
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: >-
          jq -e --arg sha "$EXPECTED_SOURCE_COMMIT"
          '.state == "certified" and .sourceCommit == $sha and ([.artifactStates[].semantic] | all(. == "certified"))'
          certification-evidence/console-copy-certification.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: mode=max
          sbom: true
