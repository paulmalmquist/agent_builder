name: paul-os

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent_builder
      POSTGRES_PASSWORD: agent_builder
      POSTGRES_DB: agent_builder
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent_builder -d agent_builder']
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - agent_builder_postgres:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      # Local Compose is an explicit single-user development deployment. Production requires OIDC.
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://agent_builder:agent_builder@postgres:5432/agent_builder?schema=public&connection_limit=10&pool_timeout=10
      BIGQUERY_ENABLED: 'false'
      BIGQUERY_MAXIMUM_BYTES_BILLED: 10000000
      GENERATOR_CLI_PATH: /workspace/apps/generator-cli/dist/index.js
      GENERATOR_TIMEOUT_MS: 60000
      GENERATOR_CONCURRENCY: 2
      GENERATOR_MAX_OUTPUT_BYTES: 1048576
      CERTIFICATION_CONCURRENCY: 2
      CERTIFICATION_RUN_TIMEOUT_MS: 120000
      CERTIFICATION_EXECUTOR_VERSION: 1.0.0
      CERTIFICATION_FULL_RUN_RETENTION: 20
      INTERPRETATION_TTL_HOURS: 24
      MAINTENANCE_ENABLED: 'true'
      MAINTENANCE_HOUR_UTC: 2
      EXECUTION_DISPATCH_MODE: external
      ALLOW_UNVERIFIED_REPOSITORY_IMPORTS: '${ALLOW_UNVERIFIED_REPOSITORY_IMPORTS:-true}'
      REPOSITORY_SOURCE_COMMIT: '${REPOSITORY_SOURCE_COMMIT:-}'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - '127.0.0.1:3000:3000'

  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command:
      [
        'sh',
        '-c',
        'npm run db:deploy -w @agent-builder/backend && if [ "$${SEED_ON_BOOT:-false}" = "true" ]; then npm run db:seed -w @agent-builder/backend; fi',
      ]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://agent_builder:agent_builder@postgres:5432/agent_builder?schema=public&connection_limit=10&pool_timeout=10
      SEED_ON_BOOT: '${SEED_ON_BOOT:-false}'
      REPOSITORY_SOURCE_COMMIT: '${REPOSITORY_SOURCE_COMMIT:-}'
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://agent_builder:agent_builder@postgres:5432/agent_builder?schema=public&connection_limit=10&pool_timeout=10
      WORKER_ID: compose-worker
      WORKER_CONCURRENCY: 2
      WORKER_POLL_MS: 1000
      WORKER_LEASE_MS: 60000
      WORKER_HEARTBEAT_MS: 15000
      WORKER_SHUTDOWN_TIMEOUT_MS: 20000
      MODEL_PROVIDER: deterministic
      PROVIDER_POLICY: direct_allowed
      MODEL_NAME: daily-brief-fixture
      MODEL_TIMEOUT_MS: 120000
      MODEL_INPUT_USD_PER_MILLION_TOKENS: 3
      MODEL_OUTPUT_USD_PER_MILLION_TOKENS: 15
      MODEL_PRICING_VERSION: local-2026-08
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'

volumes:
  agent_builder_postgres:
